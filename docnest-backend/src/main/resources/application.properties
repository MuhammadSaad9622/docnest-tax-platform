# =============================================
# DocNest - Production Configuration
# =============================================

# Server
server.port=${PORT:8080}

# =============================================
# Database
# =============================================
# Local development defaults (override via environment variables)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/docnest}
spring.datasource.username=${DB_USERNAME:docnest_user}
spring.datasource.password=${DB_PASSWORD:docnest_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Settings (small pool: serverless instances + Neon pooler)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# =============================================
# JPA / Hibernate
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# =============================================
# JWT Authentication
# =============================================
# Mapping to uppercase environment variables for Render compatibility
jwt.secret=${JWT_SECRET:eabe5e444e2cf74f197f3234f37a8cb60cff2285e0628d76c75bca45bba49ea3}
jwt.expiration=${JWT_EXPIRATION:86400000}

# =============================================
# CORS Configuration
# =============================================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174}

# =============================================
# File Storage
# =============================================
file.upload-dir=${UPLOAD_DIR:uploads}

# =============================================
# Application Name
# =============================================
spring.application.name=DocNest

# =============================================
# Multipart Configuration
# =============================================
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=5MB
